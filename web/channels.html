<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leacesy-领图</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/icon/leacesylogo.png">
</head>
<body>
    <div class="container">
        <div id="header-container"></div>

        <main>
            <div class="controls">
                <button id="refresh-button" class="secondary">Refresh</button>
                <label>
                    <input type="checkbox" id="auto-refresh"> Auto refresh
                </label>
            </div>

            <div id="channels-container" class="channels-detailed"></div>
        </main>
    </div>

    <script src="/js/header.js"></script>
    <script src="/js/channels.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            sharedComponents.loadHeader('header-container', 'channels');
        });
    </script>
</body>
</html>
