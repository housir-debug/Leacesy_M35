<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leacesy领图</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/logo.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 Channel Monitor</h1>
            <nav>
                <a href="/">Console</a>
                <a href="/channels.html" class="active">Dashboard</a>
            </nav>
        </header>

        <div class="status-bar">
            <span class="online">Online</span>
            <span id="connection-status">Device: Connecting...</span>
        </div>

        <main>
            <div class="controls">
                <button id="refresh-button" class="secondary">Refresh</button>
                <label>
                    <input type="checkbox" id="auto-refresh"> Auto refresh
                </label>
            </div>

            <div id="channels-container" class="channels-detailed"></div>
            
        </main>
    </div>

    <script src="/js/channels.js"></script>
</body>
</html>
