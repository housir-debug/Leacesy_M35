<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrument Control Panel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📡 Instrument Control Panel</h1>
            <nav>
                <a href="/" class="active">Dashboard</a>
                <a href="/scpi.html">SCPI Console</a>
                <a href="/channels.html">Channels</a>
            </nav>
        </header>

        <div class="status-bar">
            <span class="online">● Online</span>
            <span id="connection-status">WebSocket: Connecting...</span>
        </div>

        <main>
            <section class="device-info">
                <h2>Device Information</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Model</label>
                        <span id="model">Loading...</span>
                    </div>
                    <div class="info-item">
                        <label>Serial Number</label>
                        <span id="serial">Loading...</span>
                    </div>
                    <div class="info-item">
                        <label>Firmware</label>
                        <span id="firmware">Loading...</span>
                    </div>
                    <div class="info-item">
                        <label>Uptime</label>
                        <span id="uptime">Loading...</span>
                    </div>
                </div>
            </section>

            <section class="quick-channels">
                <h2>Channel Overview</h2>
                <div id="channels-container" class="channels-grid"></div>
            </section>
        </main>

        <footer>
            <p>Last update: <span id="timestamp"></span></p>
        </footer>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
