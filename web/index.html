<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leacesy-领图</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/icon/leacesylogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div id="header-container"></div>

        <main>
            <section class="device-info">
                <h2>
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                    Device Information
                </h2>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Model</label>
                        <span id="model">Loading...</span>
                    </div>
                    <div class="info-item">
                        <label>Serial-Number</label>
                        <span id="serial">Loading...</span>
                    </div>
                    <div class="info-item">
                        <label>Software-Version</label>
                        <span id="software">Loading...</span>
                    </div>
                    <div class="info-item">
                        <label>Hardware-Version</label>
                        <span id="hardware">Loading...</span>
                    </div>
                </div>
            </section>

            <section class="scpi-control">
                <h2>
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 17 10 11 4 5"/>
                        <line x1="12" y1="19" x2="20" y2="19"/>
                    </svg>
                    SCPI Command Control
                </h2>
                <div class="scpi-layout">
                    <aside class="command-sidebar">
                        <h3>
                            <svg class="section-icon small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="8" y1="6" x2="21" y2="6"/>
                                <line x1="8" y1="12" x2="21" y2="12"/>
                                <line x1="8" y1="18" x2="21" y2="18"/>
                                <line x1="3" y1="6" x2="3.01" y2="6"/>
                                <line x1="3" y1="12" x2="3.01" y2="12"/>
                                <line x1="3" y1="18" x2="3.01" y2="18"/>
                            </svg>
                            Commands List
                        </h3>
                        <div id="command-list" class="command-list"></div>
                    </aside>

                    <section class="console-main">
                        <div class="command-input-area">
                            <div class="autocomplete">
                                <input type="text" id="command-input" 
                                    placeholder="Enter SCPI command...">
                            </div>
                            <button id="send-button" class="primary">Send</button>
                            <button id="clear-button" class="secondary">Clear</button>
                        </div>

                        <div class="output-area" id="output">
                            <div class="output-line info">Ready. Enter a command or select from sidebar.</div>
                        </div>
                    </section>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/header.js"></script>
    <script src="/js/index.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            sharedComponents.loadHeader('header-container', 'console');
        });
    </script>
</body>
</html>
