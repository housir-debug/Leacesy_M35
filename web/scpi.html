<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCPI Command Console</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📟 SCPI Command Console</h1>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/scpi.html" class="active">SCPI Console</a>
                <a href="/channels.html">Channels</a>
            </nav>
        </header>

        <div class="status-bar">
            <span class="online">● Online</span>
            <span id="connection-status">WebSocket: Connecting...</span>
        </div>

        <main class="scpi-layout">
            <aside class="command-sidebar">
                <h2>Commands</h2>
                <div class="command-search">
                    <input type="text" id="command-search" placeholder="Filter commands...">
                </div>
                <div id="command-list" class="command-list"></div>
            </aside>

            <section class="console-main">
                <div class="command-input-area">
                    <div class="autocomplete">
                        <input type="text" id="command-input" 
                               placeholder="Enter SCPI command...">
                    </div>
                    <button id="send-button" class="primary">Send</button>
                    <button id="clear-button">Clear</button>
                </div>

                <div class="output-area" id="output">
                    <div class="output-line info">Ready. Enter a command or select from sidebar.</div>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/scpi.js"></script>
</body>
</html>
